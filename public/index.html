<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国杀 · 军争 · v1.1.4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="bg-ink"></div>
  <header class="topbar">
    <div class="brand" id="brand">
      <span class="brand-seal">杀</span>
      <span class="brand-title">三国杀<span class="brand-sub">军争</span><span class="brand-version">v1.1.4</span></span>
    </div>
    <nav class="topnav">
      <button class="nav-btn" id="nav-home">大厅</button>
      <button class="nav-btn" id="nav-encyclopedia">武将 · 牌堆</button>
      <button class="nav-btn" id="nav-settings">设置</button>
      <button class="nav-btn account-btn" id="nav-account">登录 / 注册</button>
    </nav>
  </header>

  <main>
    <!-- 首页 -->
    <section id="screen-home" class="screen">
      <div class="home-hero">
        <div class="hero-seal">漢</div>
        <h1 class="hero-title">三国杀<span>军争</span></h1>
        <p class="hero-sub">煮酒论英雄 · 八人军争 · 三十二将</p>
      </div>
      <div class="home-panel">
        <label class="field-label">你的昵称</label>
        <input id="input-name" class="input" maxlength="12" placeholder="例如：卧龙先生" autocomplete="off">
        <div class="mode-row">
          <button class="mode-btn active" data-mode="8">八人军争</button>
          <button class="mode-btn" data-mode="5">五人军争</button>
        </div>
        <div class="home-actions">
          <button class="btn primary" id="btn-create">创建房间</button>
          <button class="btn" id="btn-match">随机匹配</button>
        </div>
        <div class="join-row">
          <input id="input-code" class="input code-input" maxlength="8" placeholder="输入 8 位房间码" autocomplete="off">
          <button class="btn ghost" id="btn-join">加入房间</button>
        </div>
        <p class="home-hint">创建房间后可添加机器人补位；人齐后由房主开始。</p>
        <p class="home-account" id="home-account-hint">登录后可在任何设备使用同一账号，并保存战绩。</p>
      </div>
    </section>

    <!-- 房间 / 选将 -->
    <section id="screen-room" class="screen hidden">
      <div id="room-root"></div>
    </section>

    <!-- 对局 -->
    <section id="screen-game" class="screen hidden">
      <div id="game-root"></div>
    </section>

    <!-- 图鉴 -->
    <section id="screen-enc" class="screen hidden">
      <div id="encyclopedia-root"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="auth-modal" class="modal auth-modal hidden" data-act="close-auth">
    <div class="auth-card" data-act="noop">
      <button class="auth-close" data-act="close-auth">×</button>
      <div id="auth-content"></div>
    </div>
  </div>
  <audio id="bgm" loop preload="none"></audio>
  <div id="settings-modal" class="modal settings-modal hidden" data-act="close-settings">
    <div class="settings-card" data-act="noop">
      <button class="auth-close" data-act="close-settings">×</button>
      <div class="auth-title">设置</div>
      <div class="settings-row"><span>背景音乐</span><button class="btn small" id="bgm-toggle">开启</button></div>
      <div class="settings-row"><span>音量</span><input id="bgm-volume" type="range" min="0" max="100" value="35"></div>
      <div class="settings-row"><span>当前曲目</span><span id="bgm-track">主界面</span></div>
      <div class="settings-hint">主界面与对局使用不同曲目；音乐来自网易云，若无法加载可稍后重试。</div>
    </div>
  </div>
  <div id="hand-view-modal" class="modal hand-view-modal hidden" data-act="close-hand-view">    <div class="hand-view-card" data-act="noop">
      <button class="auth-close" data-act="close-hand-view">×</button>
      <div id="hand-view-content"></div>
    </div>
  </div>
  <div id="skill-modal" class="skill-modal hidden" data-act="close-skill-modal">
    <div class="skill-modal-card" data-act="noop">
      <button class="skill-modal-close" data-act="close-skill-modal">×</button>
      <div id="skill-modal-title" class="skill-modal-title"></div>
      <div id="skill-modal-body" class="skill-modal-body"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
